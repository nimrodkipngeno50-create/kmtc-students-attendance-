services:
  - type: web
    name: kmtc-nairobi-attendance
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/attendance.db
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
